[project]
name = "companion"
version = "0.1.0"
description = "Local voice companion backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "en-core-web-sm",
    "espeakng-loader>=0.2.4",
    "httpx>=0.28.1",
    "livekit>=1.2.1",
    "misaki>=0.9.4",
    "mlx-audio>=0.6.5",
    "num2words>=0.5.14",
    "numpy>=2.5.4",
    "openai>=1.50",
    "parakeet-mlx>=0.7.0",
    "phonemizer-fork>=3.3.2",
    "pysilero-vad>=3.4.0",
    "sounddevice>=0.5.6",
    "spacy>=3.8.18",
    "websockets>=17.4",
]

[project.scripts]
companion-chat = "companion.chat:main"
companion-voice = "companion.voice:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
